security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(?:_(profiler|wdt)|css|images|js)
            security: false
        api_login:
            pattern: ^/api/v1/auth/(login|register|refresh)
            stateless: true
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/v1/auth/(login|register|refresh|password-reset), roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/password-reset/confirm, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }
