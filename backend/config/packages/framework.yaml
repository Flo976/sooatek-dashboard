framework:
  secret: '%env(APP_SECRET)%'
  http_method_override: false
  session:
    handler_id: null
    cookie_secure: auto
    cookie_samesite: lax
  php_errors:
    log: true
  validation:
    email_validation_mode: html5
  serializer:
    enabled: true
  form: true
  cache:
    app: cache.adapter.filesystem
    system: cache.adapter.system
    pools:
      cache.rate_limiter:
        adapter: cache.adapter.redis
        provider: '%env(REDIS_URL)%'
