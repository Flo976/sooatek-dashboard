nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin:
            - '^https?://localhost(:[0-9]+)?$'
            - '^https?://127\\.0\\.0\\.1(:[0-9]+)?$'
        allow_credentials: true
        allow_headers: ['Content-Type', 'Authorization', 'X-Requested-With']
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
        expose_headers: ['Content-Type']
        max_age: 3600
    paths:
        '^/api/': ~
